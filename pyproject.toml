[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4i-mlops"
authors = [
    {name = "Devrath Brahme"}
]
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "integration: needs the Compose Postgres on localhost:5432 with .env sourced (deselect with -m 'not integration')",
]