[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4i-mlops"
authors = [
    {name = "Devrath Brahme"}
]
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = [
    # MLflow's SQLite store (used only by the registry tests) triggers a SQLAlchemy
    # deprecation inside MLflow itself; nothing in this repo can fix it.
    "ignore:The ``noload`` loader strategy is deprecated:sqlalchemy.exc.SADeprecationWarning",
    # Importing Evidently 0.7.23 (ai4i.monitor) triggers deprecations inside its
    # own dependencies: its legacy test module touches numpy.core, and its UI
    # server's web framework (Litestar) calls its own deprecated API.
    "ignore:numpy.core is deprecated:DeprecationWarning:evidently",
    "ignore:Call to deprecated function 'Dependency':DeprecationWarning",
    "ignore:Use of deprecated class 'DependencyKwarg':DeprecationWarning",
]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "integration: needs the Compose Postgres on localhost:5432 with .env sourced (deselect with -m 'not integration')",
]
