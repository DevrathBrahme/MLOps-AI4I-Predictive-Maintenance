# Continuous integration for the AI4I predictive-maintenance service.
# Two jobs run in parallel on fresh machines:
#   tests        the service-free layers (unit, contract, API, registry)
#   integration  Postgres from the repo's Compose file, the loader, and the
#                integration tests (feature parity, predictions_log rules)
# The full-stack smoke job is added in a later step.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The token only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: Tests (no services)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies and the package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps .
          python -m pip check

      - name: Run the service-free tests
        run: python -m pytest -m "not integration" --durations=5

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Throwaway CI-only credentials: this database exists for a few minutes
    # inside the runner and is never reachable from outside it. Compose
    # interpolates them into the postgres service; the loader and the tests
    # read them like a sourced .env.
    env:
      POSTGRES_USER: ai4i_ci
      POSTGRES_PASSWORD: ci-only-throwaway
      POSTGRES_DB: ai4i
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies and the package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps .
          python -m pip check

      - name: Start Postgres with the repo's init scripts
        run: docker compose up -d --wait postgres

      - name: Load the sensor data (CSV -> Postgres)
        run: python -m ai4i.ingest

      - name: Run the integration tests
        run: python -m pytest -m integration

      - name: Show Postgres logs
        if: failure()
        run: docker compose logs postgres