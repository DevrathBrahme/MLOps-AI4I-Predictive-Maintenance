# Continuous integration for the AI4I predictive-maintenance service.
# M9 step 1: the service-free test layers (unit, contract, API, registry).
# The integration and full-stack smoke jobs are added in later steps.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The token only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: Tests (no services)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies and the package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps .
          python -m pip check

      - name: Run the service-free tests
        run: python -m pytest -m "not integration" --durations=5